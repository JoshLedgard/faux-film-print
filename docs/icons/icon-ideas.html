<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faux Film Print Icons</title>
<style>
  :root {
    --desk: #e9e6df;
    --sheet: #ffffff;
    --ink: #1f1f22;
    --muted: #6b6a66;
    --rule: #dcd8cf;
    --tick: #9a978f;
    --dock: rgba(255,255,255,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #1b1b1d; --sheet: #26262a; --ink: #f1efea; --muted: #a3a19b;
      --rule: #3a3a3f; --tick: #6e6c67; --dock: rgba(60,60,66,0.6);
    }
  }
  :root[data-theme="dark"] {
    --desk: #1b1b1d; --sheet: #26262a; --ink: #f1efea; --muted: #a3a19b;
    --rule: #3a3a3f; --tick: #6e6c67; --dock: rgba(60,60,66,0.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--desk); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    padding: 40px 16px 120px;
  }
  .sheet {
    max-width: 980px; margin: 0 auto; background: var(--sheet);
    border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.10);
    padding: 48px 48px 56px; position: relative;
  }
  /* crop-mark corners on the sheet, echoing the app's print sheets */
  .sheet::before, .sheet::after {
    content: ""; position: absolute; width: 18px; height: 18px; border: 1px solid var(--tick);
  }
  .sheet::before { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
  .sheet::after { bottom: 16px; right: 16px; border-left: 0; border-top: 0; }
  header h1 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 40px 32px; margin-top: 40px;
  }
  .idea { border-top: 1px solid var(--rule); padding-top: 20px; }
  .idea .num { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); letter-spacing: .08em; }
  .idea h2 { font-size: 19px; margin: 6px 0 12px; }
  .hero { width: 220px; height: 220px; display: block; margin: 0 auto 14px; }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .sizes figure { margin: 0; text-align: center; }
  .sizes figcaption { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 4px; }
  .idea p { margin: 0; color: var(--muted); font-size: 14px; }
  .dock-wrap { max-width: 980px; margin: 36px auto 0; text-align: center; }
  .dock-wrap h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .08em; }
  .dock {
    display: inline-flex; gap: 14px; padding: 10px 16px; border-radius: 22px;
    background: var(--dock); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 30px rgba(0,0,0,.18); flex-wrap: wrap; justify-content: center;
  }
  .dock svg { width: 64px; height: 64px; display: block; }
  @media (max-width: 600px) {
    .sheet { padding: 32px 20px 40px; }
    .hero { width: 180px; height: 180px; }
  }
</style>
</head>
<body>
  <main class="sheet">
    <header>
      <h1>Faux Film Print: five app icon ideas</h1>
      <p>Each idea is shown large, at real macOS sizes (128, 64, 32, 16 pt), and together in a Dock below. The little ones tell you most: a good icon still reads at 16.</p>
    </header>
    <section class="grid" id="grid"></section>
  </main>

  <div class="dock-wrap">
    <h3>In the Dock</h3>
    <div class="dock" id="dock"></div>
  </div>

<script>
/* ---------- shared drawing helpers (1024×1024 macOS icon canvas) ---------- */
const PALETTES = {
  sunset: { sky: ["#f8cf95", "#e8806a"], sun: "#fff3d1", back: "#9a5d78", front: "#4e3a5c" },
  ocean:  { sky: ["#a6dbe9", "#5ea6c8"], sun: "#fffbe8", back: "#3f808c", front: "#22505c" },
  dusk:   { sky: ["#6c5aa8", "#e79c8a"], sun: "#ffdcae", back: "#3c3664", front: "#211f3c" },
  meadow: { sky: ["#cfe8f3", "#8fc4dc"], sun: "#fffbe6", back: "#7fae6a", front: "#4c7a45" },
};
const BORDER = "#F6F4EE";
let uid = 0;

/* Squircle background with Apple's 824-on-1024 grid and a soft drop shadow. */
function base(id, stops, inner) {
  return `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${stops[0]}"/><stop offset="1" stop-color="${stops[1]}"/>
      </linearGradient>
      <filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
      </filter>
      <filter id="cs${id}" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".30"/>
      </filter>
      <clipPath id="sq${id}"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    </defs>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg${id})" filter="url(#sh${id})"/>
    <g clip-path="url(#sq${id})">${inner}</g>
  </svg>`;
}

/* A little landscape that fills whatever window it's placed in. */
function scene(p, x, y, w, h) {
  const id = ++uid;
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 100 135" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient></defs>
    <rect width="100" height="135" fill="url(#sk${id})"/>
    <circle cx="66" cy="54" r="15" fill="${p.sun}"/>
    <path d="M0 96 Q28 72 54 90 T100 80 V135 H0Z" fill="${p.back}"/>
    <path d="M0 114 Q38 94 68 110 T100 104 V135 H0Z" fill="${p.front}"/>
  </svg>`;
}

/* An Instax Mini–proportioned card (54 × 86 mm, 4/6/18 mm borders). */
function card(x, y, w, p, { rot = 0, shadowId = null, blank = false } = {}) {
  const k = w / 54, h = 86 * k;
  const win = { x: x + 4 * k, y: y + 6 * k, w: 46 * k, h: 62 * k };
  const cx = x + w / 2, cy = y + h / 2;
  const pic = blank
    ? `<rect x="${win.x}" y="${win.y}" width="${win.w}" height="${win.h}" rx="${0.6 * k}" fill="#d9d6cf"/>`
    : scene(p, win.x, win.y, win.w, win.h);
  return `<g transform="rotate(${rot} ${cx} ${cy})" ${shadowId ? `filter="url(#cs${shadowId})"` : ""}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${3 * k}" fill="${BORDER}"/>
    ${pic}
  </g>`;
}

/* ---------- the five ideas ---------- */
const IDEAS = [
  {
    name: "The Mini",
    note: "One tilted Mini card on a deep teal background. It's simple and reads clearly in the Dock: you know straight away it's about instant prints.",
    draw() {
      const id = ++uid;
      return base(id, ["#2f7479", "#1b464b"],
        card(325, 195, 374, PALETTES.sunset, { rot: -7, shadowId: id }));
    },
  },
  {
    name: "Real + Faux",
    note: "Two Minis stacked. The one behind is a plain frame, and the one in front is the photo. It hints at mixing your prints in with real ones.",
    draw() {
      const id = ++uid;
      return base(id, ["#f2b35e", "#d9783f"],
        card(395, 215, 340, PALETTES.ocean, { rot: 10, shadowId: id, blank: true }) +
        card(290, 230, 340, PALETTES.sunset, { rot: -6, shadowId: id }));
    },
  },
  {
    name: "Cut Lines",
    note: "An upright card framed by crop marks on charcoal. It's about what the app does (true-size prints you cut out yourself) and looks crisp and technical.",
    draw() {
      const id = ++uid;
      const x = 352, y = 222, w = 320, k = w / 54, h = 86 * k;
      const o = 22, L = 70, t = 12;
      const marks = [
        [x - o - L, y, x - o, y], [x, y - o - L, x, y - o],
        [x + w + o, y, x + w + o + L, y], [x + w, y - o - L, x + w, y - o],
        [x - o - L, y + h, x - o, y + h], [x, y + h + o, x, y + h + o + L],
        [x + w + o, y + h, x + w + o + L, y + h], [x + w, y + h + o, x + w, y + h + o + L],
      ].map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#e9e6df" stroke-width="${t}" stroke-linecap="round"/>`).join("");
      return base(id, ["#3a3a40", "#1e1e22"], card(x, y, w, PALETTES.dusk, { shadowId: id }) + marks);
    },
  },
  {
    name: "Fresh Print",
    note: "A Mini sliding out of a little printer. It's the friendliest of the five and says \"this makes prints\", though the printer detail gets lost at 16 pt.",
    draw() {
      const id = ++uid;
      const card1 = card(370, 395, 284, PALETTES.meadow, { shadowId: id });
      const printer = `
        <rect x="230" y="250" width="564" height="210" rx="56" fill="#2b2f36" filter="url(#cs${id})"/>
        <rect x="230" y="250" width="564" height="70" rx="34" fill="#3a404a"/>
        <rect x="330" y="395" width="364" height="22" rx="11" fill="#14161a"/>
        <circle cx="720" cy="300" r="16" fill="#7fe0a8"/>`;
      return base(id, ["#dfe6ee", "#aebccc"], card1 + printer);
    },
  },
  {
    name: "Sheet of Nine",
    note: "A Letter sheet holding a 3 × 3 grid of Minis, which is exactly what the app prints. It's the most literal of the five, and the grid turns into texture when small.",
    draw() {
      const id = ++uid;
      const sx = 262, sy = 170, sw = 500, sh = sw * 279.4 / 215.9;
      const cw = 112, k = cw / 54, ch = 86 * k, gap = 4 * k;
      const gx = sx + (sw - (3 * cw + 2 * gap)) / 2, gy = sy + (sh - (3 * ch + 2 * gap)) / 2;
      const pals = [PALETTES.sunset, PALETTES.ocean, PALETTES.dusk, PALETTES.meadow];
      let cards = "";
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
        cards += card(gx + c * (cw + gap), gy + r * (ch + gap), cw, pals[(r * 3 + c) % 4]);
      return base(id, ["#2f6b4f", "#1c4433"],
        `<g transform="rotate(-5 512 512)">
           <rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="8" fill="#ffffff" filter="url(#cs${id})"/>
           ${cards}
         </g>`);
    },
  },
];

/* ---------- render ---------- */
const grid = document.getElementById("grid");
const dock = document.getElementById("dock");
IDEAS.forEach((idea, i) => {
  const el = document.createElement("article");
  el.className = "idea";
  const sizes = [128, 64, 32, 16].map(s =>
    `<figure><div style="width:${s}px;height:${s}px">${idea.draw().replace("<svg ", `<svg width="${s}" height="${s}" `)}</div><figcaption>${s}</figcaption></figure>`
  ).join("");
  el.innerHTML = `
    <div class="num">IDEA ${i + 1}</div>
    <h2>${idea.name}</h2>
    <div class="hero">${idea.draw().replace("<svg ", '<svg width="100%" height="100%" ')}</div>
    <div class="sizes">${sizes}</div>
    <p>${idea.note}</p>`;
  grid.appendChild(el);
  const d = document.createElement("div");
  d.title = idea.name;
  d.innerHTML = idea.draw();
  dock.appendChild(d);
});
</script>
</body>
</html>
