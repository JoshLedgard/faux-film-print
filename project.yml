name: FauxFilm
options:
  bundleIdPrefix: com.joshledgard
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  FauxFilmKit:
    path: FauxFilmKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FauxFilm:
    type: application
    platform: macOS
    sources: [FauxFilm]
    dependencies:
      - package: FauxFilmKit
    entitlements:
      path: FauxFilm/FauxFilm.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.print: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: FauxFilm/Info.plist
      properties:
        CFBundleDisplayName: Faux Film Print
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshledgard.fauxfilm
        PRODUCT_NAME: Faux Film Print
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
